# Temporary source-blob preparation only. Does not claim tests passed.
name: Prepare reviewed dataset fixture source
on:
  push:
    branches: ['audit/next-08-quest-identity-20260912']
    paths: ['Tools/Audit/dataset-fixture.patch', '.github/workflows/audit-dataset-fixture-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - name: Prepare exactly one reviewed blob without committing or changing refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          path = pathlib.Path('Tools/WholesomeQuestRecoveryRegressionTests/Program.cs')
          def blob_hash():
              b = path.read_bytes()
              return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          assert blob_hash() == '5e66a8c7148c6c9f3cbd8f79dab76a49ce40ff39', 'Unexpected preimage'
          subprocess.run(['git','apply','--check','--whitespace=error','Tools/Audit/dataset-fixture.patch'],check=True)
          subprocess.run(['git','apply','--whitespace=error','Tools/Audit/dataset-fixture.patch'],check=True)
          assert blob_hash() == '7f302b2be003a4cefd8fb89c780dd3593c15a1d2', 'Unexpected postimage'
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() == [path.as_posix()]
          subprocess.run(['git','diff','--check'],check=True)
          body=json.dumps({'encoding':'base64','content':base64.b64encode(path.read_bytes()).decode()}).encode()
          request=urllib.request.Request('https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request, timeout=60) as response: result=json.load(response)
          assert result['sha'] == blob_hash(), 'Uploaded blob mismatch'
          print('Prepared exact blob '+result['sha']+'. No tests, commits, refs, merge or deployment performed.')
          PY
