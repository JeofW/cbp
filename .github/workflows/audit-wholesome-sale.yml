name: Audit Wholesome sale protections
on:
  push:
    branches: ['audit/next-40-wholesome-sale-protection-20260913']
    paths: ['**.cs', '**.csproj', 'Tools/WholesomeSaleRegressionTests/**', '.github/workflows/audit-wholesome-sale.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Test actual sale method and protection manager
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'wholesome-sale-results'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          dotnet run --project Tools/WholesomeSaleRegressionTests -c Release *> (Join-Path $out 'sale-run.txt')
          $result=$LASTEXITCODE
          @{ run=$result; game_attached=$false } | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
          exit $result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wholesome-sale-${{ github.sha }}
          path: ${{ runner.temp }}/wholesome-sale-results/
          retention-days: 7
          if-no-files-found: error
