name: Audit Paladin support
on:
  push:
    branches: ['audit/next-31-paladin-support-20260913']
    paths: ['**.cs', '**.csproj', '.github/workflows/audit-paladin-support.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Execute linked production support decisions
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'paladin-support'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          dotnet run --project Tools/PaladinSupportRegressionTests -c Release *> (Join-Path $out 'support-run.txt')
          $result = $LASTEXITCODE
          @{ run = $result; game_attached = $false } | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
          exit $result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paladin-support-${{ github.sha }}
          path: ${{ runner.temp }}/paladin-support/
          retention-days: 7
          if-no-files-found: error
