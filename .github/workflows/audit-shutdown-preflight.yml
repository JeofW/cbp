# Temporary exact-source preflight. No commits or refs are written by the job.
name: Audit shutdown boundary preflight
on:
  push:
    branches: ['audit/next-24-shutdown-cleanup-20260913']
    paths: ['Tools/Audit/shutdown-boundaries.patch', '.github/workflows/audit-shutdown-preflight.yml']
permissions:
  contents: read
jobs:
  shutdown:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Verify exact patch inputs and outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'shutdown-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          $before = @{
            'Styx/Logic/BehaviorTree/TreeRoot.cs' = 'b44fb330e3bfd14e90f077b8b8fd9cbd116f5311'
            'TreeSharp/Composite.cs' = '3d1fda2135b9c4fba78785d3104fe34e4c26e00d'
            'TreeSharp/GroupComposite.cs' = '2603204df7bca027757e41150f2c4f896b950d77'
          }
          $after = @{
            'Styx/Logic/BehaviorTree/TreeRoot.cs' = 'e4859abf2fb48df74dc2c34f30a2d4685778de9f'
            'TreeSharp/Composite.cs' = '4d05b97a37271fe6ea7445d9f805a5780d85d7d2'
            'TreeSharp/GroupComposite.cs' = '9a93a4a11799736be203e32748bb6d80148bcf30'
          }
          foreach ($p in $before.Keys) { if ((git hash-object -- $p) -ne $before[$p]) { throw "Unexpected preimage $p" } }
          git apply --check --whitespace=error Tools/Audit/shutdown-boundaries.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply --whitespace=error Tools/Audit/shutdown-boundaries.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 3) { throw 'Unexpected changed paths' }
          foreach ($p in $changed) { if (-not $after.ContainsKey($p) -or (git hash-object -- $p) -ne $after[$p]) { throw "Unexpected postimage $p" } }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed' }
      - name: Execute actual shutdown, worker, core and Singular checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'shutdown-preflight'
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw 'Runtime installation failed' }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          & $runtime --list-runtimes *> (Join-Path $out 'runtimes.txt')
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path (Join-Path $out 'runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'Verified x86 desktop runtime required' }
          $results = @()
          foreach ($name in @('ShutdownBoundaryRegressionTests','QuestRecoveryRegressionTests')) {
            dotnet build "Tools/$name/$name.csproj" -c Release -p:Platform=x86 -v quiet *> (Join-Path $out "$name-build.txt")
            if ($LASTEXITCODE -ne 0) { throw "$name build failed" }
            $dlls = @(Get-ChildItem "Tools/$name/bin" -Filter "$name.dll" -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
            if ($dlls.Count -ne 1) { throw 'Expected one regression assembly' }
            & $runtime $dlls[0].FullName *> (Join-Path $out "$name-run.txt")
            $code = $LASTEXITCODE
            $results += @{suite=$name;build=0;run=$code;game_attached=$false}
            if ($name -eq 'QuestRecoveryRegressionTests') {
              & $runtime $dlls[0].FullName --routine-compatibility *> (Join-Path $out 'Singular-run.txt')
              $results += @{suite='Singular';build=0;run=$LASTEXITCODE;game_attached=$false}
            }
          }
          $results | ConvertTo-Json | Out-File (Join-Path $out 'results.json')
          if ($results.Count -ne 3 -or @($results | Where-Object { $_.run -ne 0 }).Count) { throw 'Regression failure; no source blobs will be staged' }
      - name: Stage only the verified source blobs, never refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'Styx/Logic/BehaviorTree/TreeRoot.cs' = 'e4859abf2fb48df74dc2c34f30a2d4685778de9f'
            'TreeSharp/Composite.cs' = '4d05b97a37271fe6ea7445d9f805a5780d85d7d2'
            'TreeSharp/GroupComposite.cs' = '9a93a4a11799736be203e32748bb6d80148bcf30'
          }
          $records = @()
          foreach ($p in ($expected.Keys | Sort-Object)) {
            if ((git hash-object -- $p) -ne $expected[$p]) { throw 'Source changed during verification' }
            $body = @{encoding='base64';content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $p)))} | ConvertTo-Json -Compress
            $r = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -ContentType 'application/json' -Body $body
            if ($r.sha -ne $expected[$p]) { throw 'Uploaded blob mismatch' }
            $records += @{path=$p;sha=$r.sha;sha256=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $records | ConvertTo-Json | Out-File (Join-Path $env:RUNNER_TEMP 'shutdown-preflight/verified-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shutdown-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/shutdown-preflight/
          retention-days: 7
          if-no-files-found: error
