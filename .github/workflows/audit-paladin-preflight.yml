name: Audit Paladin source preflight
on:
  push:
    branches: ['audit/next-17-paladin-decisions-20260913']
    paths: ['Tools/Audit/paladin-decisions.patch', '.github/workflows/audit-paladin-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Validate exact source and execute linked decisions plus actual Singular
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'paladin-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          $before = @{
            'runtime-snapshot/Routines/Singular wotlk/ClassSpecific/Paladin/Retribution.cs'='5fc20eb60f448bda4d2670212414f414e2ba38d2'
            'Tools/QuestRecoveryRegressionTests/RoutineCompilationRegression.cs'='4fe738cd4e884e7824dee95d5cbfdf71ed1dab37'
          }
          $after = @{
            'runtime-snapshot/Routines/Singular wotlk/ClassSpecific/Paladin/Retribution.cs'='fdbef50834ad369fcfd00fbe169ac36f1f8484e4'
            'Tools/QuestRecoveryRegressionTests/RoutineCompilationRegression.cs'='d9b31cd4f99b9bfa13e80237933f828c84792018'
          }
          foreach ($path in $before.Keys) { if ((git hash-object -- $path) -ne $before[$path]) { throw 'Unexpected preimage' } }
          git apply --check --whitespace=error Tools/Audit/paladin-decisions.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply --whitespace=error Tools/Audit/paladin-decisions.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
          if (@(git diff --name-only).Count -ne 2) { throw 'Unexpected file count' }
          foreach ($path in $after.Keys) { if ((git hash-object -- $path) -ne $after[$path]) { throw "Unexpected postimage $path" } }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff validation failed' }
          dotnet run --project Tools/PaladinDecisionRegressionTests -c Release *> (Join-Path $out 'decisions-run.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Linked decision regressions failed' }
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet', 'windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw 'x86 framework installation failed' }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          & $runtime --list-runtimes *> (Join-Path $out 'runtimes.txt')
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path (Join-Path $out 'runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'Verified x86 desktop required' }
          dotnet build Tools/QuestRecoveryRegressionTests -c Release -p:Platform=x86 -v quiet *> (Join-Path $out 'core-build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed' }
          $dlls = @(Get-ChildItem Tools/QuestRecoveryRegressionTests/bin -Filter QuestRecoveryRegressionTests.dll -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
          if ($dlls.Count -ne 1) { throw 'Expected one core assembly' }
          & $runtime $dlls[0].FullName *> (Join-Path $out 'core-run.txt')
          $core = $LASTEXITCODE
          & $runtime $dlls[0].FullName --routine-compatibility *> (Join-Path $out 'singular-run.txt')
          $singular = $LASTEXITCODE
          @{ decisions=0; core=$core; singular=$singular; game_attached=$false } | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
          if ($core -ne 0 -or $singular -ne 0) { throw 'Actual core/Singular regressions failed' }
      - name: Stage verified blobs only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'runtime-snapshot/Routines/Singular wotlk/ClassSpecific/Paladin/Retribution.cs'='fdbef50834ad369fcfd00fbe169ac36f1f8484e4'
            'Tools/QuestRecoveryRegressionTests/RoutineCompilationRegression.cs'='d9b31cd4f99b9bfa13e80237933f828c84792018'
          }
          $records = @()
          foreach ($path in $expected.Keys) {
            if ((git hash-object -- $path) -ne $expected[$path]) { throw 'Source changed during validation' }
            $body = @{encoding='base64'; content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path)))} | ConvertTo-Json -Compress
            $response = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'} -ContentType 'application/json' -Body $body
            if ($response.sha -ne $expected[$path]) { throw 'Blob identity mismatch' }
            $records += @{path=$path; sha=$response.sha; sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $records | ConvertTo-Json | Out-File (Join-Path $env:RUNNER_TEMP 'paladin-preflight/verified-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paladin-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/paladin-preflight/
          retention-days: 7
          if-no-files-found: error
