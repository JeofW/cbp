name: Audit original 3.3.5a role queries
on:
  push:
    branches: ['audit/next-35-legacy-role-compatibility-20260913']
    paths: ['Styx/Helpers/*.cs', 'Styx/WoWInternals/WoWObjects/WoWPartyMember.cs', 'runtime-snapshot/Bots/CombatBot.cs', 'Tools/LegacyRoleLuaTests/**', '.github/workflows/audit-legacy-roles.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua51:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - name: Execute exact production queries with original Lua language version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-roles"
          git rev-parse HEAD > "$RUNNER_TEMP/legacy-roles/commit.txt"
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 -v > "$RUNNER_TEMP/legacy-roles/version.txt" 2>&1
          python3 Tools/LegacyRoleLuaTests/test_roles.py --out "$RUNNER_TEMP/legacy-roles" 2>&1 | tee "$RUNNER_TEMP/legacy-roles/run.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy-roles-${{ github.sha }}
          path: ${{ runner.temp }}/legacy-roles/
          retention-days: 7
          if-no-files-found: error
