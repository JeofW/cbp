name: Audit follow-up source recovery
on:
  push:
    branches: ['audit/next-33-wholesome-evidence-20260913']
    paths: ['.github/workflows/audit-followup-source.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-recovery"
          git rev-parse HEAD > "$RUNNER_TEMP/source-recovery/commit.txt"
          git bundle create "$RUNNER_TEMP/source-recovery/source.bundle" --all
          git bundle verify "$RUNNER_TEMP/source-recovery/source.bundle"
          sha256sum "$RUNNER_TEMP/source-recovery/source.bundle" > "$RUNNER_TEMP/source-recovery/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: followup-source-${{ github.sha }}
          path: ${{ runner.temp }}/source-recovery/
          retention-days: 7
          if-no-files-found: error
