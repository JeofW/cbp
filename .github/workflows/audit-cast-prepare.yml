# One-use exact-blob preparation. Removed when this reviewed blob is committed.
name: Prepare reviewed cast-dispatch source
on:
  push:
    branches: ['audit/next-22-cast-dispatch-20260913']
    paths: ['Tools/Audit/prepare-cast-dispatch.py', '.github/workflows/audit-cast-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - name: Prepare and verify the exact source blob
        run: |
          set -euo pipefail
          python Tools/Audit/prepare-cast-dispatch.py
          git diff --check
          test "$(git diff --name-only | wc -l)" = 1
          test "$(git hash-object 'runtime-snapshot/Routines/Singular wotlk/Helpers/Spell.cs')" = 8f1aae0c1d85d04366049dac7aa786796d18956b
      - name: Stage only the verified blob, without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          p=Path('runtime-snapshot/Routines/Singular wotlk/Helpers/Spell.cs')
          b=p.read_bytes()
          expected='8f1aae0c1d85d04366049dac7aa786796d18956b'
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==expected
          body=json.dumps({'encoding':'base64','content':base64.b64encode(b).decode()}).encode()
          req=urllib.request.Request('https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
          assert result['sha']==expected
          print(json.dumps({'blob':expected,'sha256':hashlib.sha256(b).hexdigest(),'tests_executed':False,'refs_written':False}))
          PY
