name: Stage exact W42 root repair objects
on:
  push:
    branches: [audit/next-42-scheduler-observation-20260914]
    paths: [.github/audit-patches/w42-root-publish.json]
permissions:
  contents: read
jobs:
  stage:
    if: github.repository_id == '1367174964' && github.repository == 'jeofwong/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
          lfs: false
      - name: Verify exact patch and create unreferenced blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zipfile
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          root = pathlib.Path('.')
          out = pathlib.Path('/tmp/w42-root-stage'); out.mkdir()
          payload_path = '.github/audit-patches/w42-root-publish.json'
          workflow_path = '.github/workflows/audit-w42-root-stage.yml'
          expected_base = '8a6ba4e4dafceaf31225d1c6a8cab03a7af5ec2d'
          expected_patch = 'b763ed94d076cf01b73742c3a1f0bbd447e00f4ad8f70dd9f80e0bf488a0f17f'
          expected_files = {'Bots/Quest/Actions/ForcedBehaviorExecutor.cs', 'Bots/Quest/PublishedQuestRoot.cs', 'runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs', 'runtime-snapshot/Bots/WholesomeAutoQuest-master/WholesomeAutoQuest.cs'}
          assert os.environ['GITHUB_REPOSITORY'] == 'jeofwong/CopilotBuddy-private'
          assert os.environ['GITHUB_REF'] == 'refs/heads/audit/next-42-scheduler-observation-20260914'
          head = git('rev-parse', 'HEAD').decode().strip()
          assert head == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD~2').decode().strip() == expected_base
          assert set(git('diff', '--name-only', expected_base, head).decode().splitlines()) == {payload_path, workflow_path}
          payload = json.loads((root / payload_path).read_text())
          assert payload['base_commit'] == expected_base and payload['nonce'] == 'w42-root-20260915-v1'
          patch = payload['patch'].encode('utf-8')
          assert hashlib.sha256(patch).hexdigest() == expected_patch
          assert set(payload['files']) == expected_files
          for path, hashes in payload['files'].items():
              before = hashes['before']
              if before is None:
                  assert not (root / path).exists(), path
              else:
                  data = git('show', head + ':' + path)
                  assert hashlib.sha256(data).hexdigest() == before, path
                  (root / path).write_bytes(data)
          git('apply', '--index', '--whitespace=error', '-', data=patch)
          assert set(git('diff', '--cached', '--name-only').decode().splitlines()) == expected_files
          git('diff', '--cached', '--check')
          entries = []
          evidence = {'parent_commit': head, 'base_commit': expected_base, 'patch_sha256': expected_patch, 'files': {}, 'ref_updated': False, 'commit_created': False}
          def post(endpoint, body):
              assert endpoint == 'git/blobs'
              request = urllib.request.Request('https://api.github.com/repos/jeofwong/CopilotBuddy-private/' + endpoint, data=json.dumps(body).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          with zipfile.ZipFile(out / 'exact-repair-files.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(expected_files):
                  data = (root / path).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == payload['files'][path]['after'], path
                  blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  response = post('git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
                  assert response['sha'] == blob, path
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob})
                  evidence['files'][path] = {'blob': blob, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
                  archive.writestr(path, data)
          # No commit, ref update, push, test execution or credential export here.
          # Tree/commit/ref publication is performed separately after verification.
          evidence['base_tree'] = git('rev-parse', 'HEAD^{tree}').decode().strip()
          (out / 'staged.json').write_text(json.dumps(evidence, indent=2) + '\n')
          (out / 'repair.patch').write_bytes(patch)
          print(json.dumps(evidence, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w42-root-staged-objects
          path: /tmp/w42-root-stage/*
          retention-days: 14
          if-no-files-found: error
