# Temporary exact-patch validation; removed on promotion. No commits or ref writes.
name: Audit actual lift segment preflight
on:
  push:
    branches: ['audit/next-10-lift-corridors-20260912']
    paths: ['Tools/Audit/lift-corridor.patch', '.github/workflows/audit-lift-preflight.yml']
permissions:
  contents: read
jobs:
  controller-and-caller:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Validate exact source and run actual controller regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lift-preflight"
          git rev-parse HEAD > "$RUNNER_TEMP/lift-preflight/commit.txt"
          python - <<'PY'
          import subprocess
          expected={'Styx/Logic/Pathing/ElevatorTransitController.cs':'21d09ca8d442492b8cb1f77dcd160e4ded896243','Styx/Logic/Pathing/MeshNavigator.cs':'8dd6ceb1fa3fb2a0d80a1596c548c47a8a557101'}
          for p,h in expected.items(): assert subprocess.check_output(['git','hash-object',p],text=True).strip()==h
          subprocess.run(['git','apply','--check','--whitespace=error','Tools/Audit/lift-corridor.patch'],check=True)
          subprocess.run(['git','apply','--whitespace=error','Tools/Audit/lift-corridor.patch'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(expected)
          PY
          dotnet run --project Tools/ElevatorSafetyRegressionTests -c Release 2>&1 | tee "$RUNNER_TEMP/lift-preflight/run.txt"
      - name: Stage only the verified source blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          expected={'Styx/Logic/Pathing/ElevatorTransitController.cs':'3e8cea91973e55c970639bb75a0ceaefe41c849a','Styx/Logic/Pathing/MeshNavigator.cs':'0e49311c9c0cbe01180ea9e05e23726b75f062bd'}
          records=[]
          for p,h in expected.items():
              assert subprocess.check_output(['git','hash-object',p],text=True).strip()==h
              body=json.dumps({'encoding':'base64','content':base64.b64encode(pathlib.Path(p).read_bytes()).decode()}).encode()
              request=urllib.request.Request('https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
              assert result['sha']==h
              records.append({'path':p,'sha':h})
          pathlib.Path(os.environ['RUNNER_TEMP'],'lift-preflight','verified-blobs.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Retain private evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lift-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/lift-preflight/
          retention-days: 7
          if-no-files-found: error
