# Temporary, hash-locked preflight for two large files. Creates no commits or refs.
# Remove this workflow and its patch when the verified blobs are promoted by review.
name: Audit quest patch preflight
on:
  push:
    branches: ['audit/05-quest-navigation-evidence-20260912']
    paths: ['Tools/Audit/quest-navigation-evidence.patch', '.github/workflows/audit-quest-patch-preflight.yml']
permissions:
  contents: read
jobs:
  validate-exact-patch:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # Only the final git-blob upload step receives the token; no ref writes.
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Apply only the reviewed preimage and postimage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'quest-patch-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'checkout-commit.txt')
          $before = @{
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs' = '5dff11d368d2a458030004c9026d5d15495872fd'
            'Tools/WholesomeQuestRecoveryRegressionTests/Program.cs' = '5ac055d22c702fcc618d6f8da904e1984e4a4d68'
          }
          $after = @{
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs' = '8193398e7a16a51126388131e72a8bdd1e963e5b'
            'Tools/WholesomeQuestRecoveryRegressionTests/Program.cs' = '5e66a8c7148c6c9f3cbd8f79dab76a49ce40ff39'
          }
          foreach ($path in $before.Keys) {
            if ((git hash-object -- $path) -ne $before[$path]) { throw "Unexpected preimage: $path" }
          }
          git apply --check --whitespace=error Tools/Audit/quest-navigation-evidence.patch
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed patch does not apply cleanly' }
          git apply --whitespace=error Tools/Audit/quest-navigation-evidence.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 2) { throw 'Patch changed an unexpected number of files' }
          foreach ($path in $changed) {
            if (-not $after.ContainsKey($path) -or (git hash-object -- $path) -ne $after[$path]) { throw "Unexpected postimage: $path" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed' }
          git diff --stat | Out-File (Join-Path $out 'patch-stat.txt')
      - name: Run actual patched Wholesome regression executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'quest-patch-preflight'
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet', 'windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw "x86 $framework installation failed" }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          & $runtime --list-runtimes *> (Join-Path $out 'x86-runtimes.txt')
          if ($LASTEXITCODE -ne 0) { throw 'x86 runtime failed to execute' }
          if (-not (Select-String -Path (Join-Path $out 'x86-runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'x86 desktop framework missing' }
          dotnet build Tools/WholesomeQuestRecoveryRegressionTests/WholesomeQuestRecoveryRegressionTests.csproj --configuration Release -p:Platform=x86 --verbosity quiet *> (Join-Path $out 'build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Patched host/Wholesome build failed' }
          $dlls = @(Get-ChildItem Tools/WholesomeQuestRecoveryRegressionTests/bin -Filter WholesomeQuestRecoveryRegressionTests.dll -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
          if ($dlls.Count -ne 1) { throw 'Expected exactly one compiled regression assembly' }
          & $runtime $dlls[0].FullName *> (Join-Path $out 'run.txt')
          $runExit = $LASTEXITCODE
          @{ build_exit_code = 0; run_exit_code = $runExit; game_attached = $false; patched_worktree = $true } | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
          if ($runExit -ne 0) { throw 'Patched regression executable failed' }
      - name: Stage hash-verified git blobs without changing any branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'quest-patch-preflight'
          $expected = @{
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs' = '8193398e7a16a51126388131e72a8bdd1e963e5b'
            'Tools/WholesomeQuestRecoveryRegressionTests/Program.cs' = '5e66a8c7148c6c9f3cbd8f79dab76a49ce40ff39'
          }
          $records = @()
          foreach ($path in ($expected.Keys | Sort-Object)) {
            if ((git hash-object -- $path) -ne $expected[$path]) { throw "Source changed during validation: $path" }
            $body = @{ encoding = 'base64'; content = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path))) } | ConvertTo-Json -Compress
            $response = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ContentType 'application/json' -Body $body
            if ($response.sha -ne $expected[$path]) { throw "Uploaded blob identity mismatch: $path" }
            $records += @{ path = $path; sha = $response.sha; sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $records | ConvertTo-Json | Out-File (Join-Path $out 'verified-blobs.json')
          Write-Host 'Validated two source blobs. No branch, commit, merge or deployment was created by this workflow.'
      - name: Retain private preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quest-patch-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/quest-patch-preflight/
          retention-days: 7
          if-no-files-found: error
