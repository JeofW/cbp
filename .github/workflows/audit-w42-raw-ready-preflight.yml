name: Audit W42 raw-ready preparation
on:
  push:
    branches: [audit/next-42-scan-entry-20260914]
    paths: [.github/workflows/audit-w42-raw-ready-preflight.yml, 'Tools/W42RawReadyPreparation/**']
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, lfs: false, fetch-depth: 1}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.x'}
      - name: Prepare only exact-preimage candidate sources
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'w42-raw-ready-preflight'
          python Tools/W42RawReadyPreparation/apply_patch.py . $out
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          git diff --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          git diff --binary | Set-Content -Encoding utf8 (Join-Path $out 'candidate.diff')
      - name: Build and execute unchanged owner fixtures on Windows x86
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'w42-raw-ready-preflight'
          $installer=Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $dest=Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $dest -NoPath *> (Join-Path $out "install-$framework.txt")
            if($LASTEXITCODE -ne 0){throw "x86 $framework installation failed"}
          }
          & "$dest/dotnet.exe" --info *> (Join-Path $out 'runtime-info.txt')
          $results=@()
          foreach($name in @('WholesomeQuestRecoveryRegressionTests','QuestLogObservationRegressionTests')) {
            $project="Tools/$name"
            dotnet build "$project/$name.csproj" -c Release -p:Platform=x86 -p:PlatformTarget=x86 -v quiet *> (Join-Path $out "$name-build.txt")
            $build=$LASTEXITCODE
            $run=$null
            if($build -eq 0){
              $dlls=@(Get-ChildItem "$project/bin" -Recurse -Filter "$name.dll" | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
              if($dlls.Count -ne 1){throw 'Expected one executable'}
              & "$dest/dotnet.exe" $dlls[0].FullName *> (Join-Path $out "$name-run.txt")
              $run=$LASTEXITCODE
            }
            $results+=@{suite=$name;build=$build;run=$run}
          }
          @{source_commit=$env:GITHUB_SHA;suites=$results;candidate_not_committed=$true;game_attached=$false;target='Windows x86; original WoW 3.3.5a build12340'} | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $out 'results.json')
          if(@($results | Where-Object {$_.build -ne 0}).Count -ne 0){throw 'Candidate build failed'}
          # Keep broader W42 failures visible in results/logs; the next step gates this slice.
          exit 0
      - name: Verify groups and store immutable candidate blobs only, never refs or tokens
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import pathlib,hashlib,json,os,subprocess,zipfile,urllib.request
          root=pathlib.Path('.').resolve();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'w42-raw-ready-preflight'
          w=(out/'WholesomeQuestRecoveryRegressionTests-run.txt').read_text(encoding='utf-8-sig',errors='replace')
          q=(out/'QuestLogObservationRegressionTests-run.txt').read_text(encoding='utf-8-sig',errors='replace')
          wanted={
            'Raw-memory scenarios: 18/18; assertions=0; missing_contracts=0; unexpected=0':w,
            'Ready lifecycle scenarios: 3/3; assertions=0; unexpected=0':w,
            'Raw-ready scenarios: 16/16; assertions=0; unexpected=0':q,
            'Ready-log observation scenarios: 5/5':q,
            'Quest-log observation scenarios: 23/25':q,
            'Publication scenarios: 21/21; assertions=0; unexpected=0':w,
            'Publication acceptance scenarios: 9/9; assertions=0; unexpected=0':w,
            'Scan entry scenarios: 15/15; assertions=0; unexpected=0':w,
            'Scan failure scenarios: 14/14; assertions=0; unexpected=0':w,
            'Scan revocation scenarios: 13/13;':w,
            'Relation identity: 23/23;':w}
          checks={pattern:pattern in log for pattern,log in wanted.items()}
          (out/'required-groups.json').write_text(json.dumps(checks,indent=2))
          sources=json.loads((out/'candidate-blobs.json').read_text())
          allowed=['Styx/Logic/Questing/QuestLog.cs','Styx/Logic/Questing/QuestLogSnapshot.cs','runtime-snapshot/Bots/WholesomeAutoQuest-master/WholesomeAutoQuest.cs']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if sorted(changed)!=sorted(allowed) or sorted(item['path'] for item in sources)!=sorted(allowed):raise RuntimeError('Unexpected candidate source change')
          inputs=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw:continue
              name=raw.decode();p=root/name
              if p.suffix in {'.cs','.csproj','.props','.targets','.py','.yml'} and p.is_file():inputs.append({'path':name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'working-source-hashes.json').write_text(json.dumps(inputs,indent=2))
          with zipfile.ZipFile(out/'candidate-and-fixtures.zip','w',zipfile.ZIP_DEFLATED) as z:
              for item in inputs:
                  name=item['path']
                  if name in changed or name.startswith(('Tools/WholesomeQuestRecoveryRegressionTests/','Tools/QuestLogObservationRegressionTests/','Tools/W42TestAggregation/','Tools/W42RawReadyPreparation/')):z.write(root/name,name)
          if not all(checks.values()):raise RuntimeError('Required raw/ready/control groups are not green; no blob promotion')
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!='JeofW/CopilotBuddy-private':raise RuntimeError('Unexpected repository')
          stored=[]
          for item in sources:
              data=(root/item['path']).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if actual!=item['blob'] or hashlib.sha256(data).hexdigest()!=item['sha256']:raise RuntimeError('Candidate changed after preparation')
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as response:result=json.load(response)
              if result['sha']!=actual:raise RuntimeError('Stored blob identity mismatch')
              stored.append(item)
          (out/'stored-blobs.json').write_text(json.dumps(stored,indent=2))
          print('Stored three verified immutable source blobs; no commit, ref, merge or deployment.')
      - name: Hash all retained evidence
        if: always()
        shell: python
        run: |
          import pathlib,hashlib,json,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'w42-raw-ready-preflight'
          out.mkdir(exist_ok=True)
          rows=[{'path':str(p.relative_to(out)).replace('\\','/'),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p.name!='files-sha256.json']
          (out/'files-sha256.json').write_text(json.dumps(rows,indent=2))
      - name: Retain complete preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w42-raw-ready-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/w42-raw-ready-preflight/
          retention-days: 14
          if-no-files-found: error
