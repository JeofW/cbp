# Temporary exact-patch validation. Deleted after verified source promotion.
name: Audit shared routine preflight
on:
  push:
    branches: ['audit/next-11-routine-boundaries-20260912']
    paths: ['Tools/Audit/routine-boundary.patch', '.github/workflows/audit-routine-preflight.yml']
permissions:
  contents: read
jobs:
  actual-compiled-routines:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # Final step only stores verified blobs; never commits or refs.
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Validate exact changes and execute the real compiled predicates and waits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'routine-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          $before = @{'runtime-snapshot/Routines/Singular wotlk/Helpers/Spell.cs'='a60c3b5638c726d7da06eab06560d3930b5eba84';'runtime-snapshot/Routines/Singular wotlk/ClassSpecific/Priest/Shadow.cs'='226ef016f9f6820b79b14a6c8d64cfab6c64c8a6'}
          foreach ($path in $before.Keys) { if ((git hash-object -- $path) -ne $before[$path]) { throw 'Unexpected original source' } }
          git apply --check --whitespace=error Tools/Audit/routine-boundary.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not apply' }
          git apply --whitespace=error Tools/Audit/routine-boundary.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw 'Runtime install failed' }
          }
          dotnet build Tools/QuestRecoveryRegressionTests/QuestRecoveryRegressionTests.csproj -c Release -p:Platform=x86 -v quiet *> (Join-Path $out 'build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Core/routine fixture build failed' }
          $dlls = @(Get-ChildItem Tools/QuestRecoveryRegressionTests/bin -Filter QuestRecoveryRegressionTests.dll -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
          if ($dlls.Count -ne 1) { throw 'Unexpected executable count' }
          & (Join-Path $destination 'dotnet.exe') $dlls[0].FullName *> (Join-Path $out 'core-run.txt')
          $core = $LASTEXITCODE
          & (Join-Path $destination 'dotnet.exe') $dlls[0].FullName --routine-compatibility *> (Join-Path $out 'routine-run.txt')
          $routine = $LASTEXITCODE
          @{core=$core;routine=$routine;game_attached=$false} | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
          if ($core -ne 0 -or $routine -ne 0) { throw 'Actual compiled regression failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0 -or @(git diff --name-only).Count -ne 2) { throw 'Unexpected source diff' }
      - name: Stage verified source blobs only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{'runtime-snapshot/Routines/Singular wotlk/Helpers/Spell.cs'='92d963a878d7ffff4d12d3e18d05a3e2f3ed85d1';'runtime-snapshot/Routines/Singular wotlk/ClassSpecific/Priest/Shadow.cs'='115ab5e4b622aa27c406d3a6cd2653c78dc311a9'}
          $records = @()
          foreach ($path in $expected.Keys) {
            if ((git hash-object -- $path) -ne $expected[$path]) { throw 'Unexpected verified source' }
            $body = @{encoding='base64';content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path)))} | ConvertTo-Json -Compress
            $response = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -ContentType 'application/json' -Body $body
            if ($response.sha -ne $expected[$path]) { throw 'Uploaded blob mismatch' }
            $records += @{path=$path;sha=$response.sha}
          }
          $records | ConvertTo-Json | Out-File (Join-Path $env:RUNNER_TEMP 'routine-preflight/verified-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: routine-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/routine-preflight/
          retention-days: 7
          if-no-files-found: error
