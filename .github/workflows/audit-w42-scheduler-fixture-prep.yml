name: Audit W42 scheduler fixture preparation
on:
  push:
    branches: [audit/next-42-scheduler-observation-20260914]
    paths: [.github/workflows/audit-w42-scheduler-fixture-prep.yml]
permissions:
  contents: read
jobs:
  fixture:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, lfs: false}
      - name: Prepare only the allocated-memory identity fixture and store its immutable blob
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import pathlib,hashlib,json,os,urllib.request,difflib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'scheduler-fixture';out.mkdir()
          path='Tools/WholesomeQuestRecoveryRegressionTests/QuestPublicationRegressionTests.cs'
          before=pathlib.Path(path).read_bytes()
          assert hashlib.sha256(before).hexdigest()=='dc2efce6c5617951f28815d8303c564a8c606811e27cd223a48fe471f32fb74f'
          old='            Write(start + 8, descriptor); Write(start + 0x14, 4); Write(start + 0xBC, 0);'
          new=old+'\n            // Supply matching raw object/descriptor identity in this allocated fixture.\n            Write(start + 48, 123); Write(descriptor, 123);'
          text=before.decode();assert text.count(old)==1
          after=text.replace(old,new).encode()
          assert hashlib.sha256(after).hexdigest()=='b55936e7cc3423e804f02e19e2b16db170783add73085fbbf1afa8e9f6f26b67'
          blob=hashlib.sha1(b'blob '+str(len(after)).encode()+b'\0'+after).hexdigest()
          assert blob=='6bbec9de293f2ea412b7048970547c48c59f03ed'
          (out/'fixture.cs').write_bytes(after)
          (out/'fixture.diff').write_text(''.join(difflib.unified_diff(text.splitlines(True),after.decode().splitlines(True),fromfile='a/'+path,tofile='b/'+path)))
          req=urllib.request.Request('https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs',data=json.dumps({'content':after.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as response: result=json.load(response)
          assert result['sha']==blob
          (out/'identity.json').write_text(json.dumps({'github_commit':os.environ['GITHUB_SHA'],'path':path,'blob':blob,'sha256':hashlib.sha256(after).hexdigest(),'remote_commit_or_ref_updated':False,'tests_run':False,'game_attached':False},indent=2))
          print('Stored one immutable fixture blob; no remote commit/ref/merge, no production edit, no C# test claim.')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w42-scheduler-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/scheduler-fixture/
          retention-days: 14
          if-no-files-found: error
