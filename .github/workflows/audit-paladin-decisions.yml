name: Audit Paladin decisions
on:
  push:
    branches: ['audit/next-17-paladin-decisions-20260913', 'audit/next-18-final-combination-20260913']
    paths: ['**.cs', '**.csproj', '.github/workflows/audit-paladin-decisions.yml']
permissions:
  contents: read
jobs:
  decisions:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Execute actual rotation and TreeSharp with explicit boundary fixtures
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/paladin-decisions"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/commit.txt"
          dotnet build Tools/PaladinDecisionRegressionTests -c Release -v quiet > "$out/build.txt" 2>&1
          set +e
          dotnet run --project Tools/PaladinDecisionRegressionTests -c Release --no-build > "$out/run.txt" 2>&1
          result=$?
          cat "$out/run.txt"
          printf '{"run_exit_code":%s,"game_attached":false,"controlled_world_dispatch":true}\n' "$result" > "$out/result.json"
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paladin-decisions-${{ github.sha }}
          path: ${{ runner.temp }}/paladin-decisions/
          retention-days: 7
          if-no-files-found: error
