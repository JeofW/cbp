name: Audit Windows validation

on:
  push:
    branches: ['audit/**']
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/audit-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-build:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Record unmodified host build result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'audit-validation'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          dotnet --info *> (Join-Path $out 'sdk.txt')
          dotnet build CopilotBuddy.csproj --configuration Release -p:Platform=x86 --verbosity quiet *> (Join-Path $out 'host-build.txt')
          $buildExit = $LASTEXITCODE
          @{ host_build_exit_code = $buildExit; game_attached = $false; tests_run = $false } | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
          Get-Content (Join-Path $out 'host-build.txt') | Select-String ': error ' | Select-Object -First 20 | ForEach-Object { Write-Host $_.Line }
          Write-Host "Host build exit code: $buildExit. This job does not run the game or claim runtime validation."
          exit $buildExit
      - name: Retain private validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-validation-${{ github.sha }}
          path: ${{ runner.temp }}/audit-validation/
          retention-days: 7
          if-no-files-found: error
