name: Audit W42 publication preparation
on:
  push:
    branches: [audit/next-42-scan-entry-20260914]
    paths: [.github/workflows/audit-w42-publication-preflight.yml, 'Tools/W42PublicationPreparation/**']
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, lfs: false, fetch-depth: 1}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.x'}
      - name: Prepare only exact-preimage candidate sources
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'w42-publication-preflight'
          python Tools/W42PublicationPreparation/apply_patch.py . $out
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          git diff --check
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          git diff --binary | Set-Content -Encoding utf8 (Join-Path $out 'candidate.diff')
      - name: Build and execute retained real-owner publication tests on Windows x86
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'w42-publication-preflight'
          $installer=Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $dest=Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $dest -NoPath *> (Join-Path $out "install-$framework.txt")
            if($LASTEXITCODE -ne 0){throw "x86 $framework installation failed"}
          }
          & "$dest/dotnet.exe" --info *> (Join-Path $out 'runtime-info.txt')
          $project='Tools/WholesomeQuestRecoveryRegressionTests'
          dotnet build "$project/WholesomeQuestRecoveryRegressionTests.csproj" -c Release -p:Platform=x86 -p:PlatformTarget=x86 -v quiet *> (Join-Path $out 'build.txt')
          $build=$LASTEXITCODE
          $run=$null
          if($build -eq 0){
            $dlls=@(Get-ChildItem "$project/bin" -Recurse -Filter WholesomeQuestRecoveryRegressionTests.dll | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
            if($dlls.Count -ne 1){throw 'Expected one executable'}
            & "$dest/dotnet.exe" $dlls[0].FullName *> (Join-Path $out 'run.txt')
            $run=$LASTEXITCODE
          }
          @{source_commit=$env:GITHUB_SHA;build_exit=$build;run_exit=$run;candidate_not_committed=$true;game_attached=$false;target='Windows x86; original WoW 3.3.5a build12340'} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out 'results.json')
          if($build -ne 0){throw 'Candidate build failed'}
          # Broader W42 assertions are intentionally retained; inspect individual groups.
          exit 0
      - name: Verify groups and store immutable candidate blobs only, never refs or tokens
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import pathlib,hashlib,json,os,re,subprocess,zipfile,urllib.request
          root=pathlib.Path('.').resolve();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'w42-publication-preflight'
          log=(out/'run.txt').read_text(encoding='utf-8-sig',errors='replace')
          expected=[r'Publication scenarios: 21/21; assertions=0; unexpected=0',r'Publication acceptance scenarios: 9/9; assertions=0; unexpected=0',r'Scan failure scenarios: 14/14; assertions=0; unexpected=0',r'Scan revocation scenarios: 13/13;',r'Relation identity: 23/23;']
          checks={pattern:bool(re.search(pattern,log)) for pattern in expected}
          (out/'required-groups.json').write_text(json.dumps(checks,indent=2))
          sources=json.loads((out/'candidate-blobs.json').read_text())
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if sorted(changed)!=sorted(item['path'] for item in sources):raise RuntimeError('Unexpected candidate source change')
          inputs=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw:continue
              name=raw.decode();p=root/name
              if p.suffix in {'.cs','.csproj','.props','.targets','.py','.yml'} and p.is_file():inputs.append({'path':name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'working-source-hashes.json').write_text(json.dumps(inputs,indent=2))
          with zipfile.ZipFile(out/'candidate-and-fixtures.zip','w',zipfile.ZIP_DEFLATED) as z:
              for item in inputs:
                  name=item['path']
                  if name in changed or name.startswith(('Tools/WholesomeQuestRecoveryRegressionTests/','Tools/W42TestAggregation/','Tools/W42PublicationPreparation/')):z.write(root/name,name)
          if not all(checks.values()):raise RuntimeError('Required publication/control groups are not green; no blob promotion')
          repo=os.environ['GITHUB_REPOSITORY']
          if repo!='JeofW/CopilotBuddy-private':raise RuntimeError('Unexpected repository')
          stored=[]
          for item in sources:
              data=(root/item['path']).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if actual!=item['blob'] or hashlib.sha256(data).hexdigest()!=item['sha256']:raise RuntimeError('Candidate changed after preparation')
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as response:result=json.load(response)
              if result['sha']!=actual:raise RuntimeError('Stored blob identity mismatch')
              stored.append(item)
          (out/'stored-blobs.json').write_text(json.dumps(stored,indent=2))
          print('Stored',len(stored),'immutable source blobs; no commit, branch, merge or deployment performed.')
      - name: Retain complete preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w42-publication-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/w42-publication-preflight/
          retention-days: 14
          if-no-files-found: error
