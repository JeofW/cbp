# Temporary exact-source validation; remove on promotion. Never changes refs.
name: Audit Exorcism policy preflight
on:
  push:
    branches: ['audit/next-27-exorcism-policy-20260913']
    paths: ['Tools/Audit/exorcism-policy.patch', '.github/workflows/audit-exorcism-preflight.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Verify exact preimages and apply reviewed patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'exorcism-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          $before = @{
            'runtime-snapshot/Routines/Singular wotlk/ClassSpecific/Paladin/Retribution.cs' = 'fdbef50834ad369fcfd00fbe169ac36f1f8484e4'
            'Tools/QuestRecoveryRegressionTests/RoutineCompilationRegression.cs' = 'd9b31cd4f99b9bfa13e80237933f828c84792018'
          }
          foreach ($path in $before.Keys) { if ((git hash-object -- $path) -ne $before[$path]) { throw "Unexpected preimage $path" } }
          git apply --check --whitespace=error Tools/Audit/exorcism-policy.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply --whitespace=error Tools/Audit/exorcism-policy.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          if (@(git diff --name-only).Count -ne 2) { throw 'Unexpected changed paths' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace failure' }
      - name: Run linked rotation, actual compiled source, and quest core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'exorcism-preflight'
          dotnet run --project Tools/PaladinDecisionRegressionTests -c Release *> (Join-Path $out 'paladin.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Paladin decision regressions failed' }
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw 'Runtime install failed' }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          & $runtime --list-runtimes *> (Join-Path $out 'runtimes.txt')
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path (Join-Path $out 'runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'x86 desktop runtime unavailable' }
          dotnet build Tools/QuestRecoveryRegressionTests/QuestRecoveryRegressionTests.csproj -c Release -p:Platform=x86 -v quiet *> (Join-Path $out 'build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed' }
          $dlls = @(Get-ChildItem Tools/QuestRecoveryRegressionTests/bin -Filter QuestRecoveryRegressionTests.dll -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
          if ($dlls.Count -ne 1) { throw 'Unexpected compiled assembly count' }
          & $runtime $dlls[0].FullName *> (Join-Path $out 'core.txt')
          $core = $LASTEXITCODE
          & $runtime $dlls[0].FullName --routine-compatibility *> (Join-Path $out 'singular.txt')
          $singular = $LASTEXITCODE
          @{core=$core;singular=$singular;paladin=0;game_attached=$false;patched_worktree=$true} | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
          if ($core -ne 0 -or $singular -ne 0) { throw 'Core/compiled Singular regression failed' }
      - name: Upload only verified source blobs, never commits or refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'runtime-snapshot/Routines/Singular wotlk/ClassSpecific/Paladin/Retribution.cs' = 'ead82cc961c69fd6772592235fd5e44af48eae5a'
            'Tools/QuestRecoveryRegressionTests/RoutineCompilationRegression.cs' = '81d497edb21f32ac7a36a68d85cf8c8cee572717'
          }
          $records = @()
          foreach ($path in ($expected.Keys | Sort-Object)) {
            if ((git hash-object -- $path) -ne $expected[$path]) { throw "Unexpected postimage $path" }
            $body = @{encoding='base64';content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path)))} | ConvertTo-Json -Compress
            $response = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -ContentType 'application/json' -Body $body
            if ($response.sha -ne $expected[$path]) { throw 'Blob identity mismatch' }
            $records += @{path=$path;sha=$response.sha;sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $records | ConvertTo-Json | Out-File (Join-Path $env:RUNNER_TEMP 'exorcism-preflight/verified-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exorcism-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/exorcism-preflight/
          retention-days: 7
          if-no-files-found: error
