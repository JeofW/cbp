# Temporary hash-locked source validation; removed when the verified blobs are promoted.
name: Audit Wholesome relation preflight
on:
  push:
    branches: ['audit/next-39-wholesome-relations-after-merge-20260913']
    paths: ['Tools/Audit/wholesome-relation.patch', '.github/workflows/audit-relation-preflight.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact two-file patch and run the unchanged combined suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'integrated-results'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'preflight-checkout.txt')
          $before = @{
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs' = '17911b4069a0e157e54b96a892e332aacbf87aa7'
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/ProfileBuilder.cs' = 'e1e4e71809c48728f3e9582ed745b3669fc4dc44'
          }
          $after = @{
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs' = '5de03ab1cf11ec516c5196bf9cff2ed608079d44'
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/ProfileBuilder.cs' = '4fac72f00470d68927798374e3d7911596bd8dd7'
          }
          foreach ($path in $before.Keys) {
            if ((git hash-object -- $path) -ne $before[$path]) { throw "Unexpected preimage: $path" }
          }
          git apply --check --whitespace=error Tools/Audit/wholesome-relation.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch validation failed' }
          git apply --whitespace=error Tools/Audit/wholesome-relation.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 2) { throw 'Unexpected diff scope' }
          foreach ($path in $changed) {
            if (-not $after.ContainsKey($path) -or (git hash-object -- $path) -ne $after[$path]) { throw "Unexpected postimage: $path" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed' }
          $lines = Get-Content .github/workflows/audit-integrated.yml
          $body = @(); $capture = $false
          foreach ($line in $lines) {
            if ($line -eq '        run: |') { $capture = $true; continue }
            if ($capture) {
              if ($line.Length -gt 0 -and -not $line.StartsWith('          ')) { break }
              $body += $line.Substring([Math]::Min(10, $line.Length))
            }
          }
          if ($body.Count -lt 40) { throw 'Combined suite extraction failed' }
          $script = Join-Path $env:RUNNER_TEMP 'relation-combined.ps1'
          $body | Set-Content $script
          & pwsh -NoProfile -File $script
          if ($LASTEXITCODE -ne 0) { throw 'Patched combined suite failed' }
      - name: Stage verified source blobs without commits or ref changes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $after = @{
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs' = '5de03ab1cf11ec516c5196bf9cff2ed608079d44'
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/ProfileBuilder.cs' = '4fac72f00470d68927798374e3d7911596bd8dd7'
          }
          $records = @()
          foreach ($path in $after.Keys) {
            if ((git hash-object -- $path) -ne $after[$path]) { throw "Changed validated source: $path" }
            $body = @{ encoding='base64'; content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path))) } | ConvertTo-Json -Compress
            $result = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json' } -ContentType 'application/json' -Body $body
            if ($result.sha -ne $after[$path]) { throw "Uploaded blob mismatch: $path" }
            $records += @{ path=$path; sha=$result.sha; sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $records | ConvertTo-Json | Out-File (Join-Path $env:RUNNER_TEMP 'integrated-results/verified-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: relation-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-results/
          retention-days: 7
          if-no-files-found: error
