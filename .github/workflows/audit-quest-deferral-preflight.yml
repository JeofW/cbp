name: Audit quest navigation deferral preflight
on:
  push:
    branches: ['audit/next-15-quest-navigation-deferral-20260913']
    paths: ['Tools/Audit/quest-deferral.patch', '.github/workflows/audit-quest-deferral-preflight.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Apply only reviewed source bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'quest-deferral-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          $before = @{
            'Styx/Logic/Questing/Recovery/QuestRecoveryManager.cs' = '6e85b324860accf8e6f1f50e69d4e1700a4be4ce'
            'Styx/Logic/Questing/Recovery/QuestRecoveryTypes.cs' = '6460ebc12f4b7b6508c45509444ac24d76835af1'
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/WholesomeAutoQuest.cs' = '806496a99e945de34654ecc5165d468212809b7f'
          }
          $after = @{
            'Styx/Logic/Questing/Recovery/QuestRecoveryManager.cs' = '84a059ed4165653aaf08ea715522e9d99fbc95bd'
            'Styx/Logic/Questing/Recovery/QuestRecoveryTypes.cs' = '0ae3e2a2546ada6093e7bbce355c2b85cbbc5dae'
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/WholesomeAutoQuest.cs' = 'c7cdb4854c3faefdf6867327f5f16bb930d4d36f'
          }
          foreach ($path in $before.Keys) {
            if ((git hash-object -- $path) -ne $before[$path]) { throw "Unexpected preimage: $path" }
          }
          git apply --check --whitespace=error Tools/Audit/quest-deferral.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply --whitespace=error Tools/Audit/quest-deferral.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch failed' }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 3) { throw 'Unexpected changed file count' }
          foreach ($path in $changed) {
            if (-not $after.ContainsKey($path) -or (git hash-object -- $path) -ne $after[$path]) { throw "Unexpected postimage: $path" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff check failed' }
      - name: Run nine combined validation entries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'quest-deferral-preflight'
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw 'Runtime install failed' }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          & $runtime --list-runtimes *> (Join-Path $out 'runtimes.txt')
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path (Join-Path $out 'runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'Verified x86 desktop runtime required' }
          $results = @()
          foreach ($name in @('QuestRecoveryRegressionTests','WholesomeQuestRecoveryRegressionTests','QuestRecoveryAdapterRegressionTests','QuestPickupPolicyRegressionTests','VendorCoreRegressionTests','NativeContractRegressionTests')) {
            dotnet build "Tools/$name/$name.csproj" -c Release -p:Platform=x86 -v quiet *> (Join-Path $out "$name-build.txt")
            $build = $LASTEXITCODE
            $run = $null
            if ($build -eq 0) {
              $dlls = @(Get-ChildItem "Tools/$name/bin" -Filter "$name.dll" -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
              if ($dlls.Count -ne 1) { throw "Unexpected executable count for $name" }
              & $runtime $dlls[0].FullName *> (Join-Path $out "$name-run.txt")
              $run = $LASTEXITCODE
              if ($name -eq 'QuestRecoveryRegressionTests') {
                & $runtime $dlls[0].FullName --routine-compatibility *> (Join-Path $out 'Singular-run.txt')
                $results += @{suite='Singular';build=0;run=$LASTEXITCODE;game_attached=$false}
              }
            }
            $results += @{suite=$name;build=$build;run=$run;game_attached=$false}
          }
          dotnet run --project Tools/ElevatorSafetyRegressionTests -c Release *> (Join-Path $out 'Elevator-run.txt')
          $results += @{suite='Elevator';build=0;run=$LASTEXITCODE;game_attached=$false}
          python -m pip install -r Tools/EvidenceAudit/requirements.txt *> (Join-Path $out 'python-install.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Analyzer dependency install failed' }
          python -m unittest discover -s Tools/EvidenceAudit -p 'test_*.py' -v *> (Join-Path $out 'Analyzer-run.txt')
          $results += @{suite='Analyzers';build=0;run=$LASTEXITCODE;game_attached=$false}
          $results | ConvertTo-Json | Out-File (Join-Path $out 'results.json')
          $results | ConvertTo-Json | Write-Host
          if ($results.Count -ne 9 -or @($results | Where-Object { $_.build -ne 0 -or $null -eq $_.run -or $_.run -ne 0 }).Count) { exit 1 }
      - name: Stage verified blobs only, without branch or commit writes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'quest-deferral-preflight'
          $expected = @{
            'Styx/Logic/Questing/Recovery/QuestRecoveryManager.cs' = '84a059ed4165653aaf08ea715522e9d99fbc95bd'
            'Styx/Logic/Questing/Recovery/QuestRecoveryTypes.cs' = '0ae3e2a2546ada6093e7bbce355c2b85cbbc5dae'
            'runtime-snapshot/Bots/WholesomeAutoQuest-master/WholesomeAutoQuest.cs' = 'c7cdb4854c3faefdf6867327f5f16bb930d4d36f'
          }
          $records = @()
          foreach ($path in ($expected.Keys | Sort-Object)) {
            if ((git hash-object -- $path) -ne $expected[$path]) { throw 'Source bytes changed during validation' }
            $body = @{encoding='base64';content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path)))} | ConvertTo-Json -Compress
            $response = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -ContentType 'application/json' -Body $body
            if ($response.sha -ne $expected[$path]) { throw 'Uploaded source identity mismatch' }
            $records += @{path=$path;sha=$response.sha;sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $records | ConvertTo-Json | Out-File (Join-Path $out 'verified-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quest-deferral-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/quest-deferral-preflight/
          retention-days: 7
          if-no-files-found: error
