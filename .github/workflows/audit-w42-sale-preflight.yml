name: Audit W42 sale observation preflight
on:
  push:
    branches: [audit/next-42-scan-entry-20260914]
    paths: [.github/workflows/audit-w42-sale-preflight.yml]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, lfs: false, fetch-depth: 1}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.x'}
      - name: Prepare one hash-locked candidate and local-only extraction snapshot
        shell: python
        run: |
          import pathlib,hashlib,json,os,subprocess,difflib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'w42-sale-preflight';out.mkdir()
          name='runtime-snapshot/Bots/WholesomeAutoQuest-master/WholesomeAutoQuest.cs'
          p=pathlib.Path(name);before=p.read_bytes()
          if hashlib.sha256(before).hexdigest()!='bd8d7eea211159b3742f7359d14aa8157bd234a67f5379f12bdbd22c2dab3ad7':raise RuntimeError('Production preimage changed')
          s=before.decode('utf-8')
          edits=[('            var accepted = me.QuestLog.GetAllQuests();\n            if (accepted == null)\n                return;\n','            var questLog = me.QuestLog;\n            var observation = questLog.CaptureSnapshot();\n            if (observation == null || !observation.IsComplete)\n                return;\n            var accepted = observation.Quests;\n'),('                || !MerchantFrame.Instance.IsVisible)\n                return;\n            MerchantFrame.Instance.SellItemQualities(mask, protectedNames, protectedIds);','                || !MerchantFrame.Instance.IsVisible\n                || !questLog.IsSnapshotCurrent(observation))\n                return;\n            MerchantFrame.Instance.SellItemQualities(mask, protectedNames, protectedIds);')]
          for old,new in edits:
              if s.count(old)!=1:raise RuntimeError('Ambiguous candidate boundary')
              s=s.replace(old,new)
          data=s.encode('utf-8');sha=hashlib.sha256(data).hexdigest()
          if sha!='9aac61d06fea0e5941af247ed217af4262b72378680b289b2a66233283ea712f':raise RuntimeError('Candidate postimage differs')
          p.write_bytes(data);(out/'WholesomeAutoQuest.cs').write_bytes(data)
          (out/'candidate.diff').write_text(''.join(difflib.unified_diff(before.decode().splitlines(True),s.splitlines(True),fromfile='a/'+name,tofile='b/'+name)),encoding='utf-8')
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          (out/'candidate-blob.json').write_text(json.dumps({'path':name,'blob':blob,'sha256':sha,'before_sha256':hashlib.sha256(before).hexdigest()},indent=2))
          subprocess.run(['git','diff','--check'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          if changed!=[name]:raise RuntimeError('Unexpected changed source')
          # A LOCAL-ONLY object lets the retained extractor read an immutable ref.
          # No remote refs, branches or commits are created by this workflow.
          subprocess.run(['git','add','--',name],check=True)
          subprocess.run(['git','-c','user.name=Audit Candidate','-c','user.email=audit-candidate@example.invalid','-c','commit.gpgsign=false','commit','-m','Local-only sale candidate for exact-source extraction'],check=True)
          local=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'source-identity.json').write_text(json.dumps({'github_source_commit':os.environ['GITHUB_SHA'],'local_only_candidate_commit':local,'candidate_not_published':True,'game_attached':False},indent=2))
          subprocess.run(['python','Tools/QuestObservationBoundaryRegressionTests/extract_owners.py','--repo','.','--ref',local,'--out','Tools/QuestObservationBoundaryRegressionTests/Generated'],check=True)
      - name: Run retained sale and actual owner suites with Windows x86
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'w42-sale-preflight'
          $installer=Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $dest=Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $dest -NoPath *> (Join-Path $out "install-$framework.txt")
            if($LASTEXITCODE -ne 0){throw "x86 runtime installation failed"}
          }
          & "$dest/dotnet.exe" --info *> (Join-Path $out 'runtime-info.txt')
          $results=@()
          foreach($name in @('QuestLogObservationRegressionTests','WholesomeSaleRegressionTests','QuestObservationBoundaryRegressionTests','WholesomeQuestRecoveryRegressionTests')) {
            $project="Tools/$name"
            dotnet build "$project/$name.csproj" -c Release -p:Platform=x86 -p:PlatformTarget=x86 -v quiet *> (Join-Path $out "$name-build.txt")
            $build=$LASTEXITCODE;$run=$null
            if($build -eq 0){
              $dlls=@(Get-ChildItem "$project/bin" -Recurse -Filter "$name.dll" | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
              if($dlls.Count -ne 1){throw 'Expected one executable'}
              $arguments=@($dlls[0].FullName)
              if($name -eq 'QuestObservationBoundaryRegressionTests'){$arguments+=@(Join-Path $out 'boundary-cases.json')}
              & "$dest/dotnet.exe" @arguments *> (Join-Path $out "$name-run.txt")
              $run=$LASTEXITCODE
            }
            $results+=@{suite=$name;build=$build;run=$run}
          }
          @{github_source_commit=$env:GITHUB_SHA;suites=$results;candidate_not_published=$true;game_attached=$false} | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $out 'results.json')
          if(@($results | Where-Object {$_.build -ne 0}).Count -ne 0){throw 'Candidate build failed'}
          exit 0
      - name: Verify exact cases and store only the immutable source blob
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import pathlib,hashlib,json,os,subprocess,zipfile,urllib.request
          root=pathlib.Path('.').resolve();out=pathlib.Path(os.environ['RUNNER_TEMP'])/'w42-sale-preflight'
          read=lambda name:(out/name).read_text(encoding='utf-8-sig',errors='replace')
          q=read('QuestLogObservationRegressionTests-run.txt');w=read('WholesomeQuestRecoveryRegressionTests-run.txt');sale=read('WholesomeSaleRegressionTests-run.txt')
          wanted={'Sale observation scenarios: 28/28; assertions=0; unexpected=0':q,'Quest-log observation scenarios: 25/25':q,'Raw-ready scenarios: 16/16; assertions=0; unexpected=0':q,'Ready-log observation scenarios: 5/5':q,'Wholesome sale scenarios: 23/23':sale,'Publication scenarios: 21/21; assertions=0; unexpected=0':w,'Publication acceptance scenarios: 9/9; assertions=0; unexpected=0':w,'Raw-memory scenarios: 18/18; assertions=0; missing_contracts=0; unexpected=0':w,'Ready lifecycle scenarios: 3/3; assertions=0; unexpected=0':w,'Scan entry scenarios: 15/15; assertions=0; unexpected=0':w,'Relation identity: 23/23;':w}
          checks={pattern:pattern in log for pattern,log in wanted.items()}
          b=json.loads(read('boundary-cases.json'));checks['retained boundary24/24']=b['executed_cases']==24 and b['assertion_failures']==0 and b['unexpected_errors']==0
          result=json.loads(read('results.json'));checks['expected aggregate exits']=all(item['build']==0 and item['run']==(1 if item['suite']=='WholesomeQuestRecoveryRegressionTests' else 0) for item in result['suites'])
          (out/'required-groups.json').write_text(json.dumps(checks,indent=2))
          inputs=[]
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw:continue
              name=raw.decode();p=root/name
              if p.suffix in {'.cs','.csproj','.props','.targets','.py','.yml'} and p.is_file():inputs.append({'path':name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'working-source-hashes.json').write_text(json.dumps(inputs,indent=2))
          prefixes=('Tools/WholesomeQuestRecoveryRegressionTests/','Tools/QuestLogObservationRegressionTests/','Tools/WholesomeSaleRegressionTests/','Tools/QuestObservationBoundaryRegressionTests/','Tools/W42TestAggregation/')
          source=json.loads(read('candidate-blob.json'))
          with zipfile.ZipFile(out/'candidate-and-fixtures.zip','w',zipfile.ZIP_DEFLATED) as z:
              for item in inputs:
                  name=item['path']
                  if name==source['path'] or name.startswith(prefixes) or name=='Styx/Logic/Questing/QuestLogSnapshot.cs':z.write(root/name,name)
          if not all(checks.values()):raise RuntimeError('Expected owner/control groups not green; no blob stored')
          if os.environ['GITHUB_REPOSITORY']!='JeofW/CopilotBuddy-private':raise RuntimeError('Unexpected repository')
          data=(root/source['path']).read_bytes()
          if hashlib.sha256(data).hexdigest()!=source['sha256']:raise RuntimeError('Candidate changed after validation')
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as response:stored=json.load(response)
          if stored['sha']!=source['blob']:raise RuntimeError('Stored blob mismatch')
          (out/'stored-blob.json').write_text(json.dumps(source,indent=2))
          print('Stored one verified immutable source blob; no remote commit, ref, merge or deployment.')
      - name: Hash all retained evidence
        if: always()
        shell: python
        run: |
          import pathlib,hashlib,json,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'w42-sale-preflight';out.mkdir(exist_ok=True)
          rows=[{'path':str(p.relative_to(out)).replace('\\','/'),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p.name!='files-sha256.json']
          (out/'files-sha256.json').write_text(json.dumps(rows,indent=2))
      - name: Retain complete candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w42-sale-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/w42-sale-preflight/
          retention-days: 14
          if-no-files-found: error
