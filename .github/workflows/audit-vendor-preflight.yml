name: Audit temporary vendor travel preflight
on:
  push:
    branches: ['audit/next-16-vendor-travel-backoff-20260913']
    paths: ['Tools/Audit/prepare-vendor-backoff.py', '.github/workflows/audit-vendor-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact source candidate and run owner regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'vendor-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          python Tools/Audit/prepare-vendor-backoff.py > (Join-Path $out 'candidate-blobs.json')
          if ($LASTEXITCODE -ne 0) { throw 'Source identity check failed' }
          git add --intent-to-add Styx/Logic/Profiles/VendorTravelBackoff.cs
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff validation failed' }
          if (@(git diff --name-only).Count -ne 5) { throw 'Unexpected source changes' }
          git diff --stat | Out-File (Join-Path $out 'diff-stat.txt')
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet', 'windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw "x86 $framework installation failed" }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          & $runtime --list-runtimes *> (Join-Path $out 'runtimes.txt')
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path (Join-Path $out 'runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'Verified x86 desktop required' }
          $results = @()
          foreach ($name in @('WholesomeQuestRecoveryRegressionTests', 'VendorCoreRegressionTests', 'QuestRecoveryRegressionTests')) {
            dotnet build "Tools/$name/$name.csproj" -c Release -p:Platform=x86 -v quiet *> (Join-Path $out "$name-build.txt")
            $build = $LASTEXITCODE
            $run = $null
            if ($build -eq 0) {
              $dlls = @(Get-ChildItem "Tools/$name/bin" -Filter "$name.dll" -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
              if ($dlls.Count -ne 1) { throw 'Expected one assembly' }
              & $runtime $dlls[0].FullName *> (Join-Path $out "$name-run.txt")
              $run = $LASTEXITCODE
              if ($name -eq 'QuestRecoveryRegressionTests') {
                & $runtime $dlls[0].FullName --routine-compatibility *> (Join-Path $out 'Singular-run.txt')
                $results += @{ suite='Singular'; build=0; run=$LASTEXITCODE; game_attached=$false }
              }
            }
            $results += @{ suite=$name; build=$build; run=$run; game_attached=$false }
          }
          $results | ConvertTo-Json | Out-File (Join-Path $out 'results.json')
          if ($results.Count -ne 4 -or @($results | Where-Object { $_.build -ne 0 -or $null -eq $_.run -or $_.run -ne 0 }).Count) { throw 'Regression failure; source not promoted' }
      - name: Stage verified blobs without any branch or commit write
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'vendor-preflight'
          $records = Get-Content (Join-Path $out 'candidate-blobs.json') -Raw | ConvertFrom-Json
          foreach ($record in $records) {
            if ((git hash-object -- $record.path) -ne $record.sha) { throw 'Source changed during validation' }
            $body = @{ encoding='base64'; content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $record.path))) } | ConvertTo-Json -Compress
            $response = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' } -ContentType 'application/json' -Body $body
            if ($response.sha -ne $record.sha) { throw 'Uploaded blob identity mismatch' }
          }
          $records | ConvertTo-Json | Out-File (Join-Path $out 'verified-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vendor-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/vendor-preflight/
          retention-days: 7
          if-no-files-found: error
