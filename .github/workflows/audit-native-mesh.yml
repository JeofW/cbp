name: Audit actual native mesh replay
on:
  push:
    branches: ['audit/next-07-integrated-mesh-20260912']
    paths: ['Tools/NativeMeshAudit/**', '.github/workflows/audit-native-mesh.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mesh-replay:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Verify actual LFS bytes and record complete dataset inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'native-mesh-results'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          git lfs fsck *> (Join-Path $out 'lfs-integrity.txt')
          if ($LASTEXITCODE -ne 0) { throw 'LFS integrity verification failed' }
          git lfs ls-files --json | Out-File (Join-Path $out 'lfs-inventory.json')
          $files = @(Get-ChildItem mmaps -File -Recurse)
          $files | Select-Object @{n='path';e={$_.FullName.Substring($PWD.Path.Length+1)}},Length | ConvertTo-Json | Out-File (Join-Path $out 'mesh-files.json')
          $total = ($files | Measure-Object Length -Sum).Sum
          @{ file_count=$files.Count; total_bytes=$total; game_attached=$false } | ConvertTo-Json | Out-File (Join-Path $out 'mesh-summary.json')
          if ($total -lt 1000000) { throw 'Only pointers or incomplete mesh data were retrieved' }
          Get-ChildItem Lib -Filter '*Navigation*.dll' | Get-FileHash -Algorithm SHA256 | Format-List | Out-File (Join-Path $out 'native-binary-hashes.txt')
      - name: Run captured paths through the actual native library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'native-mesh-results'
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet', 'windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw "x86 $framework installation failed" }
          }
          dotnet build Tools/NativeMeshAudit/NativeMeshAudit.csproj -c Release -p:Platform=x86 -v quiet *> (Join-Path $out 'build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Native audit build failed' }
          $dlls = @(Get-ChildItem Tools/NativeMeshAudit/bin -Filter NativeMeshAudit.dll -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
          if ($dlls.Count -ne 1) { throw 'Unexpected native audit assembly count' }
          # The native loader may resolve mmaps relative to either cwd or executable.
          New-Item -ItemType Junction -Path (Join-Path $dlls[0].DirectoryName 'mmaps') -Target (Join-Path $PWD 'mmaps') | Out-Null
          & (Join-Path $destination 'dotnet.exe') $dlls[0].FullName $PWD.Path $out *> (Join-Path $out 'run.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Native replay did not establish mesh compatibility; inspect evidence' }
      - name: Retain compact private native evidence, never mesh binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-mesh-${{ github.sha }}
          path: ${{ runner.temp }}/native-mesh-results/
          retention-days: 7
          if-no-files-found: error
