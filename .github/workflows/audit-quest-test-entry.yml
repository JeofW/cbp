# Temporary test-only preparation and expected-red verification. No production edits.
name: Audit recovered quest test entry
on:
  push:
    branches: ['audit/next-33-wholesome-observations-20260913']
    paths: ['Tools/Audit/prepare_quest_test_entry.py', '.github/workflows/audit-quest-test-entry.yml']
permissions:
  contents: read
jobs:
  verify-red:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Execute all recovered groups against unchanged production
        shell: pwsh
        run: |
          python Tools/Audit/prepare_quest_test_entry.py
          if ($LASTEXITCODE -ne 0) { throw 'Test source preparation failed' }
          & pwsh -NoProfile -File quest-test-combined.ps1
          $out=Join-Path $env:RUNNER_TEMP 'integrated-results'
          $results=Get-Content (Join-Path $out 'results.json') -Raw | ConvertFrom-Json
          $failed=@($results | Where-Object { $_.run -ne 0 })
          if ($results.Count -ne 11 -or @($results | Where-Object { $_.build -ne 0 -or $null -eq $_.run }).Count -ne 0 -or $failed.Count -ne 2) { throw 'Expected exactly two compiled failing test owners' }
          if (@($failed | Where-Object { $_.suite -notin @('WholesomeQuestRecoveryRegressionTests','QuestPickupPolicyRegressionTests') }).Count) { throw 'Unexpected failing suite' }
          $groups=@{
            'QuestPickupPolicyRegressionTests-run.txt'=@('Pickup observation scenarios:', 'Missing-offer evidence cases:')
            'WholesomeQuestRecoveryRegressionTests-run.txt'=@('Wholesome inventory/pickup edge scenarios:', 'Owned collection scheduling:', 'Inventory materialization:')
          }
          foreach ($file in $groups.Keys) { foreach ($marker in $groups[$file]) { if (-not (Select-String -Path (Join-Path $out $file) -SimpleMatch $marker)) { throw "Unexecuted group: $marker" } } }
          Write-Host 'Expected-red run verified. These are reproduced failures, not passing gameplay tests.'
      - name: Stage only verified test-source blobs without changing refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $expected=Get-Content quest-test-blobs.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($path in $expected.Keys) {
            if ((git hash-object -- $path) -ne $expected[$path]) { throw "Test source changed: $path" }
            $body=@{encoding='base64';content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path)))} | ConvertTo-Json -Compress
            $response=Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -ContentType 'application/json' -Body $body
            if ($response.sha -ne $expected[$path]) { throw "Test blob mismatch: $path" }
          }
          Copy-Item quest-test-blobs.json (Join-Path $env:RUNNER_TEMP 'integrated-results/verified-test-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quest-test-entry-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-results/
          retention-days: 7
          if-no-files-found: error
