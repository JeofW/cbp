name: Audit timed movement controlled preflight
on:
  push:
    branches: ['audit/next-09-timed-movement-20260912']
    paths: ['Tools/Audit/timed-*.patch', '.github/workflows/audit-timed-preflight.yml']
permissions:
  contents: read
jobs:
  controlled-red-green:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # Final step creates one verified blob, never commits or refs.
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Verify controlled red, then the complete repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'timed-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          $path = 'Styx/WoWInternals/WoWMovement.cs'
          if ((git hash-object -- $path) -ne 'c099728fc7a9abeff9330ce85dc63ad2dee769c1') { throw 'Unexpected original source' }
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw 'Runtime installation failed' }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          $project = 'Tools/QuestRecoveryRegressionTests/QuestRecoveryRegressionTests.csproj'
          foreach ($variant in @('availability','fix')) {
            git apply --check --whitespace=error "Tools/Audit/timed-$variant.patch"
            if ($LASTEXITCODE -ne 0) { throw 'Patch preimage mismatch' }
            git apply --whitespace=error "Tools/Audit/timed-$variant.patch"
            if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
            $expected = if ($variant -eq 'availability') { '4109c527bad06dcc047f796725159b32a1f5ba28' } else { '1bf572c83e02fd9892485c92c88c3179329b07c4' }
            if ((git hash-object -- $path) -ne $expected) { throw 'Unexpected patch postimage' }
            dotnet build $project -c Release -p:Platform=x86 -v quiet *> (Join-Path $out "$variant-build.txt")
            if ($LASTEXITCODE -ne 0) { throw 'Preflight must compile before comparing behavioral outcomes' }
            $dlls = @(Get-ChildItem Tools/QuestRecoveryRegressionTests/bin -Filter QuestRecoveryRegressionTests.dll -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
            if ($dlls.Count -ne 1) { throw 'Unexpected executable count' }
            & $runtime $dlls[0].FullName *> (Join-Path $out "$variant-run.txt")
            $exitCode = $LASTEXITCODE
            Get-Content (Join-Path $out "$variant-run.txt") | Select-String 'timed movement|Timed movement|initializer' | ForEach-Object { Write-Host $_.Line }
            if ($variant -eq 'availability') {
              if ($exitCode -eq 0) { throw 'Expected timer-ownership failures with availability guard only' }
              if (Select-String -Path (Join-Path $out "$variant-run.txt") -Pattern "type initializer for 'Styx.StyxWoW'") { throw 'Client startup still masks ownership tests' }
            } elseif ($exitCode -ne 0) { throw 'Full repair must pass actual core regressions' }
          }
          & $runtime $dlls[0].FullName --routine-compatibility *> (Join-Path $out 'routine-run.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Existing Singular compatibility failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0 -or @(git diff --name-only).Count -ne 1) { throw 'Unexpected source diff' }
          @{controlled_red=$true; repair_green=$true; game_attached=$false; model_operations=2000} | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
      - name: Store the verified source blob only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Styx/WoWInternals/WoWMovement.cs'
          if ((git hash-object -- $path) -ne '1bf572c83e02fd9892485c92c88c3179329b07c4') { throw 'Source changed during tests' }
          $body = @{encoding='base64';content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path)))} | ConvertTo-Json -Compress
          $response = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -ContentType 'application/json' -Body $body
          if ($response.sha -ne '1bf572c83e02fd9892485c92c88c3179329b07c4') { throw 'Uploaded source hash mismatch' }
          $response | ConvertTo-Json | Out-File (Join-Path $env:RUNNER_TEMP 'timed-preflight/verified-blob.json')
      - name: Retain private results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timed-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/timed-preflight/
          retention-days: 7
          if-no-files-found: error
