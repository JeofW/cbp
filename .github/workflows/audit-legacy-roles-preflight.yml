# Temporary hash-locked adapter preflight. Removed when the verified blobs are promoted.
name: Audit original role adapter preflight
on:
  push:
    branches: ['audit/next-35-legacy-role-compatibility-20260913']
    paths: ['Tools/LegacyRoleLuaTests/prepare.py', '.github/workflows/audit-legacy-roles-preflight.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Verify and test exact patched adapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/role-preflight"
          git rev-parse HEAD > "$RUNNER_TEMP/role-preflight/commit.txt"
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          python3 Tools/LegacyRoleLuaTests/prepare.py
          python3 Tools/LegacyRoleLuaTests/test_roles.py --out "$RUNNER_TEMP/role-preflight" 2>&1 | tee "$RUNNER_TEMP/role-preflight/lua-run.txt"
          dotnet run --project Tools/LegacyRoleLuaTests -c Release 2>&1 | tee "$RUNNER_TEMP/role-preflight/adapter-run.txt"
      - name: Upload only verified blobs without changing refs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os,json,base64,hashlib,urllib.request
          from pathlib import Path
          expected=json.loads(Path('role-blobs.json').read_text())
          for path,sha in expected.items():
              b=Path(path).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert actual==sha
              body=json.dumps({'encoding':'base64','content':base64.b64encode(b).decode()}).encode()
              request=urllib.request.Request('https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert json.load(response)['sha']==sha
          Path(os.environ['RUNNER_TEMP'],'role-preflight','verified-blobs.json').write_text(json.dumps(expected,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: role-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/role-preflight/
          retention-days: 7
          if-no-files-found: error
