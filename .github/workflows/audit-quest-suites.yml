name: Audit quest regression suites
on:
  push:
    branches: ['audit/04-quest-validation-20260912']
    paths: ['**.cs', '**.csproj', '.github/workflows/audit-quest-suites.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quest-suites:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install and verify x86 runtime frameworks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'quest-suite-results'
          New-Item -ItemType Directory -Force $out | Out-Null
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet', 'windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw "x86 $framework installation failed" }
          }
          & (Join-Path $destination 'dotnet.exe') --list-runtimes *> (Join-Path $out 'x86-runtimes.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Installed x86 runtime host did not execute' }
          if (-not (Select-String -Path (Join-Path $out 'x86-runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'x86 desktop framework missing' }
      - name: Build and run all five checked-in quest and vendor suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'quest-suite-results'
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          $runtime = Join-Path $env:RUNNER_TEMP 'dotnet-x86/dotnet.exe'
          $results = @()
          foreach ($name in @('QuestRecoveryRegressionTests', 'WholesomeQuestRecoveryRegressionTests', 'QuestRecoveryAdapterRegressionTests', 'QuestPickupPolicyRegressionTests', 'VendorCoreRegressionTests')) {
            $project = "Tools/$name/$name.csproj"
            dotnet build $project --configuration Release -p:Platform=x86 --verbosity quiet *> (Join-Path $out "$name-build.txt")
            $build = $LASTEXITCODE
            $run = $null
            if ($build -eq 0) {
              $dll = Get-ChildItem "Tools/$name/bin" -Filter "$name.dll" -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' } | Select-Object -First 1
              if ($null -eq $dll) { $run = 99 } else {
                & $runtime $dll.FullName *> (Join-Path $out "$name-run.txt")
                $run = $LASTEXITCODE
              }
            }
            $results += [ordered]@{ suite = $name; build_exit_code = $build; run_exit_code = $run; game_attached = $false }
            Write-Host "$name build=$build run=$run"
          }
          $results | ConvertTo-Json | Out-File (Join-Path $out 'results.json')
          if (@($results | Where-Object { $_.build_exit_code -ne 0 -or $_.run_exit_code -ne 0 }).Count -gt 0) { exit 1 }
      - name: Retain complete private suite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quest-suites-${{ github.sha }}
          path: ${{ runner.temp }}/quest-suite-results/
          retention-days: 7
          if-no-files-found: error
