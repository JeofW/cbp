name: Audit integrated regression baseline
on:
  push:
    branches: ['master', 'audit/next-*']
    paths: ['**.cs', '**.csproj', 'Tools/EvidenceAudit/**', 'Tools/W42TestAggregation/**', 'Tools/MountedCombatRegressionTests/**', 'runtime-snapshot/Bots/WholesomeAutoQuest-master/quest_data/**', 'Tools/QuestLogObservationRegressionTests/Directory.Build.targets', 'Tools/WholesomeQuestRecoveryRegressionTests/Directory.Build.targets', '.github/workflows/audit-integrated.yml', '.github/workflows/audit-w42-normalized.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    # Owner-authorized public CI; no fork/PR event or arbitrary manual ref.
    if: >-
      github.repository == 'JeofW/cbp' &&
      github.repository_id == '1367174964' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'branch' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/audit/next-'))
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Execute every retained owner and W42 under Windows x86 without meshes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'integrated-results'
          New-Item -ItemType Directory -Force $out | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          $sha | Out-File (Join-Path $out 'commit.txt')
          @{production_commit=$sha; production_tree=(git rev-parse 'HEAD^{tree}'); fixture_commit=$sha; working_tree_modified=$false; game_attached=$false} | ConvertTo-Json | Out-File (Join-Path $out 'source-identity.json')
          python Tools/EvidenceAudit/release_evidence_335.py --repo . --output (Join-Path $out 'complete-source-before.json')
          if ($LASTEXITCODE -ne 0) { throw 'The exact clean source candidate is required' }
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet', 'windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw "x86 $framework installation failed" }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          & $runtime --info *> (Join-Path $out 'runtime-info.txt')
          & $runtime --list-runtimes *> (Join-Path $out 'runtimes.txt')
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path (Join-Path $out 'runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'Verified x86 desktop runtime required' }
          python Tools/QuestObservationBoundaryRegressionTests/extract_owners.py --repo . --ref $sha --out Tools/QuestObservationBoundaryRegressionTests/Generated *> (Join-Path $out 'W42-extraction.txt')
          $extraction = $LASTEXITCODE
          $results = @()
          $projects = @(
            @{project='QuestRecoveryRegressionTests'; suite='QuestRecoveryRegressionTests'},
            @{project='WholesomeQuestRecoveryRegressionTests'; suite='WholesomeQuestRecoveryRegressionTests'},
            @{project='QuestRecoveryAdapterRegressionTests'; suite='QuestRecoveryAdapterRegressionTests'},
            @{project='QuestPickupPolicyRegressionTests'; suite='QuestPickupPolicyRegressionTests'},
            @{project='VendorCoreRegressionTests'; suite='VendorCoreRegressionTests'},
            @{project='NativeContractRegressionTests'; suite='NativeContractRegressionTests'},
            @{project='ShutdownBoundaryRegressionTests'; suite='ShutdownBoundaryRegressionTests'},
            @{project='ElevatorSafetyRegressionTests'; suite='Elevator'},
            @{project='PaladinDecisionRegressionTests'; suite='PaladinDecisions'},
            @{project='GroupEngagementRegressionTests'; suite='GroupEngagement'},
            @{project='PaladinSupportRegressionTests'; suite='PaladinSupport'},
            @{project='WholesomeSaleRegressionTests'; suite='WholesomeSale'},
            @{project='QuestLogObservationRegressionTests'; suite='QuestLogObservationRegressionTests'},
            @{project='QuestCompletionOwnerRegressionTests'; suite='QuestCompletionOwnerRegressionTests'},
            @{project='QuestObservationBoundaryRegressionTests'; suite='QuestObservationBoundaryRegressionTests'},
            @{project='NavigationOwnerRegressionTests'; suite='NavigationOwnerRegressionTests'},
            @{project='GroundOwnerRegressionTests'; suite='GroundOwnerRegressionTests'},
            @{project='FlightOwnerRegressionTests'; suite='FlightOwnerRegressionTests'},
            @{project='ObjectReacquisitionRegressionTests'; suite='ObjectReacquisitionRegressionTests'},
            @{project='RestObservationRegressionTests'; suite='RestObservationRegressionTests'},
            @{project='GroundTransitionRegressionTests'; suite='GroundTransitionRegressionTests'},
            @{project='GroundApproachRegressionTests'; suite='GroundApproachRegressionTests'},
            @{project='WorldQueryRegressionTests'; suite='WorldQueryRegressionTests'},
            @{project='IndoorApproachRegressionTests'; suite='IndoorApproachRegressionTests'},
            @{project='MountedCombatRegressionTests'; suite='MountedCombatRegressionTests'},
            @{project='MountedGroundIntegrationRegressionTests'; suite='MountedGroundIntegrationRegressionTests'},
            @{project='GroundCollectionIntegrationRegressionTests'; suite='GroundCollectionIntegrationRegressionTests'},
            @{project='GroundDismountRecoveryRegressionTests'; suite='GroundDismountRecoveryRegressionTests'},
            @{project='CombatPoiTransitionRegressionTests'; suite='CombatPoiTransitionRegressionTests'},
            @{project='QuestSourceExecutionRegressionTests'; suite='QuestSourceExecutionRegressionTests'}
          )
          $expectedSuites = @($projects.suite) + @('Singular', 'Analyzers')
          if (@($expectedSuites | Select-Object -Unique).Count -ne $expectedSuites.Count) { throw 'Duplicate validation suite' }
          foreach ($entry in $projects) {
            $name = $entry.project
            $suite = $entry.suite
            dotnet build "Tools/$name/$name.csproj" -c Release -p:Platform=x86 -p:PlatformTarget=x86 -v quiet *> (Join-Path $out "$suite-build.txt")
            $build = $LASTEXITCODE
            $run = $null
            $harnessError = $null
            if ($build -eq 0) {
              $dlls = @(Get-ChildItem "Tools/$name/bin" -Filter "$name.dll" -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
              if ($dlls.Count -ne 1) { $harnessError = "Unexpected executable count: $($dlls.Count)" }
              elseif ($name -eq 'QuestObservationBoundaryRegressionTests' -and $extraction -ne 0) { $harnessError = 'Pinned extraction failed; not a behavioral reproduction' }
              else {
                $arguments = @($dlls[0].FullName)
                if ($name -eq 'QuestCompletionOwnerRegressionTests') { $arguments += @((Join-Path $out 'completion-cases.json'), (Join-Path $out 'source-identity.json')) }
                if ($name -eq 'QuestObservationBoundaryRegressionTests') { $arguments += (Join-Path $out 'boundary-cases.json') }
                & $runtime @arguments *> (Join-Path $out "$suite-run.txt")
                $run = $LASTEXITCODE
              }
            }
            $results += @{suite=$suite; build=$build; run=$run; harness_error=$harnessError; game_attached=$false; architecture='x86'}
            if ($name -eq 'QuestRecoveryRegressionTests') {
              $singular = $null
              if ($build -eq 0 -and $dlls.Count -eq 1) {
                & $runtime $dlls[0].FullName --routine-compatibility *> (Join-Path $out 'Singular-run.txt')
                $singular = $LASTEXITCODE
              }
              $results += @{suite='Singular'; build=$build; run=$singular; game_attached=$false; architecture='x86'}
            }
          }
          python -m pip install -r Tools/EvidenceAudit/requirements.txt *> (Join-Path $out 'python-install.txt')
          $analyzerBuild = $LASTEXITCODE
          $analyzerRun = $null
          if ($analyzerBuild -eq 0) {
            python -m unittest discover -s Tools/EvidenceAudit -p 'test_*.py' -v *> (Join-Path $out 'Analyzer-run.txt')
            $analyzerRun = $LASTEXITCODE
          }
          $results += @{suite='Analyzers'; build=$analyzerBuild; run=$analyzerRun; game_attached=$false}
          $results | ConvertTo-Json -Depth 8 | Out-File (Join-Path $out 'results.json')
          foreach ($name in @('QuestLogObservationRegressionTests','WholesomeQuestRecoveryRegressionTests')) {
            $target = Join-Path $out "normalized/$name"
            New-Item -ItemType Directory -Force $target | Out-Null
            Get-ChildItem "Tools/$name/obj" -Directory -Filter W42Normalized -Recurse | ForEach-Object { Copy-Item $_.FullName $target -Recurse -Force }
          }
          python Tools/EvidenceAudit/release_evidence_335.py --repo . --output (Join-Path $out 'complete-source-after.json') --compare (Join-Path $out 'complete-source-before.json')
          if ($LASTEXITCODE -ne 0) { throw 'Source or runtime knowledge changed during validation' }
          $completeSource = Get-Content (Join-Path $out 'complete-source-after.json') -Raw | ConvertFrom-Json
          $inputs = @($completeSource.inputs.PSObject.Properties | ForEach-Object { @{path=$_.Name; sha256=$_.Value} })
          $inputs | ConvertTo-Json -Depth 5 | Out-File (Join-Path $out 'working-source-hashes.json')
          $hashes = @(Get-ChildItem $out -File -Recurse | ForEach-Object { @{path=[IO.Path]::GetRelativePath($out,$_.FullName); sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          $hashes | ConvertTo-Json -Depth 5 | Out-File (Join-Path $out 'files-sha256.json')
          $results | ConvertTo-Json -Depth 8 | Write-Host
          if (@(Compare-Object ($expectedSuites | Sort-Object) ($results.suite | Sort-Object)).Count -ne 0 -or
              $results.Count -ne $expectedSuites.Count -or
              @($results | Where-Object { $_.build -ne 0 -or $null -eq $_.run -or $_.run -ne 0 }).Count) { exit 1 }
      - name: Retain complete regression results (public artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-results/
          retention-days: 14
          if-no-files-found: error
