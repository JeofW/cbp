# Temporary, exact-source validation; removed on promotion.
name: Audit group safety preflight
on:
  push:
    branches: ['audit/next-32-group-engagement-20260913']
    paths: ['Tools/Audit/prepare_group_safety.py', '.github/workflows/audit-group-preflight.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Validate reviewed sources and twelve combined entries
        shell: pwsh
        run: |
          python Tools/Audit/prepare_group_safety.py
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation failed' }
          & pwsh -NoProfile -File group-combined.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Group preflight failed' }
      - name: Stage verified blobs without changing references
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $expected=Get-Content group-blobs.json -Raw | ConvertFrom-Json -AsHashtable
          $records=@()
          foreach ($path in $expected.Keys) {
            if ((git hash-object -- $path) -ne $expected[$path]) { throw "Source changed: $path" }
            $body=@{encoding='base64';content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $path)))} | ConvertTo-Json -Compress
            $reply=Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -ContentType 'application/json' -Body $body
            if ($reply.sha -ne $expected[$path]) { throw "Blob mismatch: $path" }
            $records+=@{path=$path;sha=$reply.sha}
          }
          $records | ConvertTo-Json | Out-File (Join-Path $env:RUNNER_TEMP 'integrated-results/verified-blobs.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: group-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/integrated-results/
          retention-days: 7
          if-no-files-found: error
