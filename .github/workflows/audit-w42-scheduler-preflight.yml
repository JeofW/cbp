name: Audit W42 scheduler candidate preflight
on:
  push:
    branches: [audit/next-42-scheduler-observation-20260914]
    paths: [.github/workflows/audit-w42-scheduler-preflight.yml]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'jeofwong/CopilotBuddy-private' && github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, lfs: false, fetch-depth: 0}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '10.0.x'}
      - name: Prepare exact one-file candidate as a local-only test source
        shell: python
        run: |
          import pathlib,subprocess,hashlib,json,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'scheduler-preflight';out.mkdir()
          subprocess.run(['python','Tools/W42TestAggregation/prepare_scheduler_candidate.py',str(out/'candidate')],check=True)
          p='runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs'
          assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()=='6741ddc6c2058cbcbc5722f5e0982972eff37ac45dc83abcd9593c9dd86d2ad8'
          subprocess.run(['git','diff','--check'],check=True)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()==[p]
          subprocess.run(['git','add',p],check=True)
          subprocess.run(['git','-c','user.name=Audit Candidate','-c','user.email=audit-candidate@example.invalid','-c','commit.gpgsign=false','commit','-m','Local-only exact scheduler candidate'],check=True)
          local=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (out/'source.json').write_text(json.dumps({'github_commit':os.environ['GITHUB_SHA'],'local_only_candidate_commit':local,'remote_commit_or_ref_updated':False,'game_attached':False},indent=2))
      - name: Execute all focused owners under Windows x86
        shell: pwsh
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'scheduler-preflight'
          $installer=Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $dest=Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach($framework in @('dotnet','windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $dest -NoPath *> (Join-Path $out "install-$framework.txt")
            if($LASTEXITCODE -ne 0){throw 'x86 runtime installation failed'}
          }
          $source=Get-Content (Join-Path $out 'source.json') -Raw | ConvertFrom-Json
          python Tools/W42TestAggregation/verify.py --repo . --out (Join-Path $out 'focused') --runtime "$dest/dotnet.exe" --fixtures $source.local_only_candidate_commit --variant current *> (Join-Path $out 'runner.txt')
          $LASTEXITCODE | Set-Content (Join-Path $out 'runner-exit.txt')
          exit 0
      - name: Verify exact outcomes and store only the immutable tested source blob
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import pathlib,json,hashlib,os,urllib.request,re
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'scheduler-preflight';root=out/'focused'
          read=lambda n:(root/n).read_text(encoding='utf-8-sig',errors='replace')
          result=json.loads(read('results.json'));checks={}
          checks['all four focused projects build and run']=len(result['suites'])==4 and all(x['build']['exit']==0 and x['run']['exit']==0 for x in result['suites'])
          w=read('WholesomeQuestRecoveryRegressionTests-run.txt');q=read('QuestLogObservationRegressionTests-run.txt')
          for pattern in ['Scheduler raw-publication scenarios: 23/23; assertions=0; unexpected=0','Scheduler observation scenarios: 5/5;','Publication scenarios: 21/21; assertions=0; unexpected=0','Publication acceptance scenarios: 9/9; assertions=0; unexpected=0','Raw-memory scenarios: 18/18; assertions=0; missing_contracts=0; unexpected=0','Ready lifecycle scenarios: 3/3; assertions=0; unexpected=0','Scan entry scenarios: 15/15; assertions=0; unexpected=0','Scan failure scenarios: 14/14; assertions=0; unexpected=0','Scan retry scenarios: 6/6','Scan revocation scenarios: 13/13','Relation identity: 23/23;']:
              checks[pattern]=pattern in w
          checks['no failing aggregate group']='FAIL aggregate group:' not in w
          checks['sale28']='Sale observation scenarios: 28/28; assertions=0; unexpected=0' in q
          checks['observation25']='Quest-log observation scenarios: 25/25' in q
          checks['ready16']='Raw-ready scenarios: 16/16; assertions=0; unexpected=0' in q
          checks['ready5']='Ready-log observation scenarios: 5/5' in q
          checks['completion15']='Completion-owner cases: 15/15; assertions 0; unexpected 0' in read('QuestCompletionOwnerRegressionTests-run.txt')
          b=json.loads(read('boundary-cases.json'));checks['boundary24']=b['executed_cases']==24 and b['assertion_failures']==0 and b['unexpected_errors']==0
          (out/'checks.json').write_text(json.dumps(checks,indent=2))
          if not all(checks.values()):raise RuntimeError('Candidate verification failed; no blob stored')
          p='runtime-snapshot/Bots/WholesomeAutoQuest-master/QuestScheduler.cs';data=pathlib.Path(p).read_bytes()
          assert hashlib.sha256(data).hexdigest()=='6741ddc6c2058cbcbc5722f5e0982972eff37ac45dc83abcd9593c9dd86d2ad8'
          req=urllib.request.Request('https://api.github.com/repos/jeofwong/CopilotBuddy-private/git/blobs',data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as response:stored=json.load(response)
          assert stored['sha']=='61fac208910fc182918cf17a1020bc0d868e765d'
          (out/'verified-blob.json').write_text(json.dumps({'path':p,'blob':stored['sha'],'sha256':hashlib.sha256(data).hexdigest(),'remote_commit_or_ref_updated':False},indent=2))
          print('Exact scheduler candidate and all focused groups passed; immutable blob stored; no remote commit/ref/merge.')
      - name: Hash all transferred evidence
        if: always()
        shell: python
        run: |
          import pathlib,hashlib,json,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'scheduler-preflight';out.mkdir(exist_ok=True)
          rows=[{'path':str(p.relative_to(out)).replace('\\','/'),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p!=out/'files-sha256.json']
          (out/'files-sha256.json').write_text(json.dumps(rows,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: w42-scheduler-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/scheduler-preflight/
          retention-days: 14
          if-no-files-found: error
