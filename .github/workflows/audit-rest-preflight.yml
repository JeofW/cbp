name: Audit rest ownership preflight
on:
  push:
    branches: ['audit/next-20-rest-ownership-20260913']
    paths: ['Tools/Audit/prepare-rest-ownership.py', '.github/workflows/audit-rest-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'JeofW/CopilotBuddy-private' && github.event.repository.private == true && github.actor == 'JeofW'
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Check exact repair and run the Wholesome owner suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'rest-preflight'
          New-Item -ItemType Directory -Force $out | Out-Null
          git rev-parse HEAD | Out-File (Join-Path $out 'commit.txt')
          python Tools/Audit/prepare-rest-ownership.py > (Join-Path $out 'candidate.json')
          if ($LASTEXITCODE -ne 0) { throw 'Source identity mismatch' }
          git diff --check
          if ($LASTEXITCODE -ne 0 -or @(git diff --name-only).Count -ne 1) { throw 'Unexpected source diff' }
          git diff | Out-File (Join-Path $out 'source.diff')
          $installer = Join-Path (Split-Path $env:RUNNER_WORKSPACE) '_actions/actions/setup-dotnet/67a3573c9a986a3f9c594539f4ab511d57bb3ce9/externals/install-dotnet.ps1'
          $destination = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          foreach ($framework in @('dotnet', 'windowsdesktop')) {
            & pwsh -NoProfile -File $installer -Channel '10.0' -Runtime $framework -Architecture x86 -InstallDir $destination -NoPath *> (Join-Path $out "install-$framework.txt")
            if ($LASTEXITCODE -ne 0) { throw 'x86 framework installation failed' }
          }
          $runtime = Join-Path $destination 'dotnet.exe'
          & $runtime --list-runtimes *> (Join-Path $out 'runtimes.txt')
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path (Join-Path $out 'runtimes.txt') -Pattern 'Microsoft.WindowsDesktop.App 10\.')) { throw 'Verified x86 desktop required' }
          dotnet build Tools/WholesomeQuestRecoveryRegressionTests -c Release -p:Platform=x86 -v quiet *> (Join-Path $out 'build.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Owner build failed' }
          $dlls = @(Get-ChildItem Tools/WholesomeQuestRecoveryRegressionTests/bin -Filter WholesomeQuestRecoveryRegressionTests.dll -Recurse | Where-Object { $_.FullName -notmatch '[\\/](ref|refint)[\\/]' })
          if ($dlls.Count -ne 1) { throw 'Expected one owner assembly' }
          & $runtime $dlls[0].FullName *> (Join-Path $out 'run.txt')
          $result = $LASTEXITCODE
          @{build=0; run=$result; game_attached=$false} | ConvertTo-Json | Out-File (Join-Path $out 'result.json')
          if ($result -ne 0) { throw 'Regression failure; no source promotion' }
      - name: Stage one verified blob without changing refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'rest-preflight'
          $record = Get-Content (Join-Path $out 'candidate.json') -Raw | ConvertFrom-Json
          if ((git hash-object -- $record.path) -ne $record.sha) { throw 'Source changed during tests' }
          $body = @{encoding='base64'; content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD $record.path)))} | ConvertTo-Json -Compress
          $response = Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/JeofW/CopilotBuddy-private/git/blobs' -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'} -ContentType 'application/json' -Body $body
          if ($response.sha -ne $record.sha) { throw 'Uploaded identity mismatch' }
          $record | ConvertTo-Json | Out-File (Join-Path $out 'verified-blob.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rest-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/rest-preflight/
          retention-days: 7
          if-no-files-found: error
