<!doctype html><meta charset="utf-8"><title>CopilotBuddy evidence graph</title>
<style>body{font:16px system-ui;margin:24px;background:#101722;color:#edf3fa}select,input{font:inherit;padding:8px}svg{width:100%;height:64vh;border:1px solid #64748b}circle{fill:#334155;stroke:#9cc3ef;cursor:pointer}text{fill:#edf3fa;font:12px system-ui;pointer-events:none}line{stroke:#90a5c0;stroke-width:1.3;opacity:.55}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{font:inherit;padding:8px}</style>
<h1>Directed evidence graph</h1><p>Arrows are labeled hypotheses, not proof of causation. Select a saved query or node to inspect provenance and falsification.</p>
<select id="queries"><option value="">All curated edges</option></select> <input id="search" placeholder="Filter node labels"> <button id="reset">Reset</button>
<svg viewBox="0 0 1200 800" id="graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="23" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#90a5c0"/></marker></defs><g id="edges"></g><g id="nodes"></g></svg><pre id="details">Select a node.</pre>
<script>const data=PAYLOAD;const q=document.getElementById('queries'),search=document.getElementById('search'),detail=document.getElementById('details');const ns='http://www.w3.org/2000/svg';for(const key of Object.keys(data.saved_queries)){let o=document.createElement('option');o.value=key;o.textContent=key;q.append(o)}function draw(){let query=data.saved_queries[q.value],seed=query?new Set(query.seeds):null;let es=data.edges.filter(e=>!query||(query.loop?e.loop===query.loop:seed.has(e.source)||seed.has(e.target)));let keep=new Set(es.flatMap(e=>[e.source,e.target]));let vs=data.nodes.filter(n=>(!query||keep.has(n.id))&&(!search.value||n.label.toLowerCase().includes(search.value.toLowerCase())));let pos=new Map(vs.map((n,i)=>[n.id,[600+490*Math.cos(i*2*Math.PI/vs.length),400+320*Math.sin(i*2*Math.PI/vs.length)]]));let eg=document.getElementById('edges'),ng=document.getElementById('nodes');eg.replaceChildren();ng.replaceChildren();for(const e of es){if(!pos.has(e.source)||!pos.has(e.target))continue;let a=pos.get(e.source),b=pos.get(e.target),l=document.createElementNS(ns,'line');for(const [k,v]of Object.entries({x1:a[0],y1:a[1],x2:b[0],y2:b[1],'marker-end':'url(#arrow)'}))l.setAttribute(k,v);l.onclick=()=>detail.textContent=JSON.stringify(e,null,2);eg.append(l)}for(const n of vs){let [x,y]=pos.get(n.id),c=document.createElementNS(ns,'circle'),t=document.createElementNS(ns,'text');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',13);c.onclick=()=>detail.textContent=JSON.stringify({node:n,outgoing:es.filter(e=>e.source===n.id),incoming:es.filter(e=>e.target===n.id)},null,2);t.setAttribute('x',x);t.setAttribute('y',y+28);t.setAttribute('text-anchor','middle');t.textContent=n.label.length>32?n.label.slice(0,29)+'...':n.label;ng.append(c,t)}}q.onchange=draw;search.oninput=draw;document.getElementById('reset').onclick=()=>{q.value='';search.value='';draw()};draw();</script>
